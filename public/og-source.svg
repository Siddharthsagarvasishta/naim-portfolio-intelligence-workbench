<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">nAIM Portfolio Intelligence Workbench</title>
  <desc id="desc">Evidence-governed portfolio movement analysis on synthetic demonstration data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0a1d33"/>
      <stop offset="1" stop-color="#102a45"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d9c7"/>
      <stop offset="1" stop-color="#4d8dff"/>
    </linearGradient>
    <linearGradient id="waterfall" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2867d6"/>
      <stop offset="1" stop-color="#42d5ca"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8eb4d8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <circle cx="1140" cy="30" r="230" fill="#2c78eb" opacity="0.08" filter="url(#glow)"/>
  <circle cx="70" cy="600" r="220" fill="#32d4c5" opacity="0.07" filter="url(#glow)"/>

  <g transform="translate(66 58)" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif">
    <g aria-label="nAIM wordmark">
      <text x="0" y="94" font-size="96" font-weight="720" letter-spacing="-5" fill="#f5f9ff">n</text>
      <text x="57" y="94" font-size="96" font-weight="760" letter-spacing="-5" fill="url(#brand)">AIM</text>
    </g>
    <text x="2" y="128" font-size="13" font-weight="700" letter-spacing="2.4" fill="#8fb1d0">PRONOUNCED “NAME”  ·  AIM = ALL IS MINE</text>

    <text x="0" y="194" font-size="31" font-weight="650" fill="#eaf3fc">Portfolio Intelligence</text>
    <text x="0" y="232" font-size="31" font-weight="650" fill="#eaf3fc">Workbench</text>
    <rect x="0" y="263" width="74" height="4" rx="2" fill="#38d9c7"/>

    <text x="0" y="328" font-size="33" font-weight="590" fill="#ffffff">Name the movement.</text>
    <text x="0" y="370" font-size="33" font-weight="590" fill="#ffffff">Own the evidence.</text>

    <text x="0" y="424" font-size="16" fill="#9bb8d3">Point-in-time analytics · exact reconciliation · governed decisions</text>

    <g transform="translate(0 470)">
      <rect width="130" height="38" rx="19" fill="#11304a" stroke="#2e7893"/>
      <circle cx="20" cy="19" r="5" fill="#38d9c7"/>
      <text x="34" y="24" font-size="13" font-weight="700" letter-spacing="1" fill="#cce9e6">SYNTHETIC</text>
      <rect x="142" width="149" height="38" rx="19" fill="#11304a" stroke="#315c91"/>
      <circle cx="162" cy="19" r="5" fill="#4d8dff"/>
      <text x="176" y="24" font-size="13" font-weight="700" letter-spacing="1" fill="#d8e5fb">POINT-IN-TIME</text>
      <rect x="303" width="150" height="38" rx="19" fill="#11304a" stroke="#8a6b2c"/>
      <circle cx="323" cy="19" r="5" fill="#f3b94b"/>
      <text x="337" y="24" font-size="13" font-weight="700" letter-spacing="1" fill="#f8e5b8">HUMAN REVIEW</text>
    </g>
  </g>

  <g transform="translate(580 52)" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect width="554" height="523" rx="24" fill="#f6f2e9"/>
    <rect x="1" y="1" width="552" height="521" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>

    <text x="34" y="45" font-size="13" font-weight="800" letter-spacing="2.2" fill="#31516c">GOVERNED MOVEMENT BRIDGE</text>
    <text x="34" y="103" font-size="54" font-weight="750" letter-spacing="-2" fill="#0c263c">+311.4</text>
    <text x="225" y="103" font-size="20" font-weight="700" fill="#0c263c">bps</text>
    <text x="34" y="130" font-size="15" fill="#597084">Annualised net loss rate · Aug 2025 vs Jul 2025</text>

    <g transform="translate(34 164)">
      <line x1="0" y1="230" x2="486" y2="230" stroke="#a7b8c2" stroke-width="1"/>
      <line x1="0" y1="170" x2="486" y2="170" stroke="#d4dcd9" stroke-width="1" stroke-dasharray="4 5"/>
      <line x1="0" y1="110" x2="486" y2="110" stroke="#d4dcd9" stroke-width="1" stroke-dasharray="4 5"/>
      <line x1="0" y1="50" x2="486" y2="50" stroke="#d4dcd9" stroke-width="1" stroke-dasharray="4 5"/>

      <rect x="36" y="221" width="82" height="9" rx="3" fill="#f3b94b"/>
      <rect x="198" y="56" width="96" height="174" rx="4" fill="url(#waterfall)"/>
      <rect x="374" y="53" width="96" height="177" rx="4" fill="#0c263c"/>

      <text x="77" y="209" text-anchor="middle" font-size="16" font-weight="750" fill="#7c5b19">+4.4</text>
      <text x="246" y="44" text-anchor="middle" font-size="16" font-weight="750" fill="#136a69">+307.0</text>
      <text x="422" y="41" text-anchor="middle" font-size="16" font-weight="750" fill="#0c263c">+311.4</text>

      <text x="77" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#4a6172">MIX</text>
      <text x="246" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#4a6172">WITHIN-SEGMENT</text>
      <text x="422" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#4a6172">OBSERVED</text>
    </g>

    <g transform="translate(34 451)">
      <circle cx="14" cy="12" r="11" fill="#d8f3ee"/>
      <path d="M9 12l3 3 7-8" fill="none" stroke="#147f74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="17" font-size="14" font-weight="750" fill="#16364d">DQ 100/100</text>
      <line x1="136" y1="1" x2="136" y2="23" stroke="#c2cfcf"/>
      <text x="154" y="17" font-size="14" fill="#4b6374">Primary driver: Affiliate</text>
      <line x1="355" y1="1" x2="355" y2="23" stroke="#c2cfcf"/>
      <text x="373" y="17" font-size="14" font-weight="700" fill="#8a5d00">Associational</text>
    </g>

    <text x="34" y="502" font-size="11.5" fill="#728695">Synthetic, institution-neutral demonstration evidence · human approval required</text>
  </g>
</svg>
