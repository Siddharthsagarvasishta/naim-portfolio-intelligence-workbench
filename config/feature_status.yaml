{
  "schema_version": "1.1.0",
  "registry_version": "2.0.0",
  "product": "nAIM Portfolio Intelligence Workbench",
  "description": "Conservative capability truth registry. A LIVE status means executable evidence and a focused test exist in this repository; it does not imply production deployment.",
  "allowed_statuses": [
    "LIVE",
    "INTEGRATION_ONLY",
    "DOCUMENTED",
    "DISABLED",
    "NOT_IMPLEMENTED"
  ],
  "status_definitions": {
    "LIVE": "Executable in the repository with focused test evidence.",
    "INTEGRATION_ONLY": "An interface, scaffold, or offline interoperability asset exists, but the end-to-end capability is not validated as live.",
    "DOCUMENTED": "Method or integration intent is documented without an executable repository implementation.",
    "DISABLED": "Executable code exists but is intentionally unavailable under the current configuration.",
    "NOT_IMPLEMENTED": "No executable implementation is present."
  },
