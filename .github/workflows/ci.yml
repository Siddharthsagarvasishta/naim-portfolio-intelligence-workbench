name: nAIM Portfolio Intelligence Workbench CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend
        run: python -m pip install -e ".[analytics,interop,dev]"
      - name: Install document-generation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint backend
        run: |
          python scripts/check_public_brand.py
          python -m ruff check src apps tests scripts
      - name: Check backend and frontend API contracts
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_openapi.py --check
          python scripts/generate_frontend_api_types.py --check
      - name: Run source-checkout analytical and API tests
        env:
          PYTHONPATH: src
          NAIM_DATASET_PROFILE: test
        # The full release runner covers artifact-backed tests after generating the
        # governed evidence, BI, Office, and showcase outputs. Those large generated
        # artifacts are intentionally excluded from the public source checkout.
        run: |
          python -m pytest --cov=src/naim_risk --cov-report=term-missing \
            --ignore=tests/unit/test_feature_status.py \
            --ignore=tests/unit/test_powerbi_project.py \
            --ignore=tests/unit/test_public_showcase.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Test and build frontend
        run: npm test

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build containers
        run: docker compose build
