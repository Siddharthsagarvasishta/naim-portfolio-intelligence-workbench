[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naim-portfolio-intelligence-workbench"
version = "0.1.0"
description = "nAIM Portfolio Intelligence Workbench — Name the movement. Own the evidence."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "pyarrow>=10,<20",
  "duckdb>=0.10,<2",
  "scipy>=1.10,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26",
  "PyJWT[crypto]>=2.8,<3",
]

[project.scripts]
naim = "naim_risk.cli:main"

[project.optional-dependencies]
analytics = [
  "scikit-learn>=1.3,<2",
  "statsmodels>=0.14,<1",
]
interop = [
  "psycopg[binary]>=3.1,<4",
  "tableauhyperapi>=0.0.20000,<1",
]
public-demo = [
  "streamlit>=1.35,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6,<7",
  "ruff>=0.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naim_risk = ["resources/config/*.json", "resources/models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"
markers = [
  "integration: exercises multiple backend layers",
  "performance: checks a bounded local timing target",
  "slow: uses the full default synthetic profile",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/naim_risk/api.py" = ["B008"]
